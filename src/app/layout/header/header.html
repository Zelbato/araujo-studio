<header class="header" [class.is-scrolled]="scrolled() || menuOpen()">
  <div class="shell header__bar">
    <a href="#inicio" class="brand" (click)="closeMenu()">
      <span class="brand__name">Heitor <span>Araujo</span></span>
      <span class="brand__role">{{ site.role }}</span>
    </a>

    <nav class="nav" aria-label="Navegação principal">
      <ul class="nav__list">
        @for (item of navItems; track item.id) {
          <li>
            <a
              class="nav__link"
              [href]="'#' + item.id"
              [class.is-active]="active() === item.id"
              [attr.aria-current]="active() === item.id ? 'location' : null"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <a href="#contato" class="btn btn--ghost btn--sm header__cta">
      Solicitar orçamento
      <lucide-icon class="btn__icon" [img]="arrowIcon" [size]="16" aria-hidden="true" />
    </a>

    <button
      #toggle
      type="button"
      class="menu-toggle"
      [class.is-open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-mobile"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ menuOpen() ? 'Fechar menu' : 'Abrir menu' }}</span>
      <span class="menu-toggle__lines" aria-hidden="true"><i></i><i></i></span>
    </button>
  </div>

  <div id="menu-mobile" class="mobile-menu" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
    <nav class="shell" aria-label="Navegação principal (menu)">
      <ol class="mobile-menu__list">
        @for (item of navItems; track item.id; let i = $index) {
          <li [style.--i]="i">
            <a
              class="mobile-menu__link"
              [href]="'#' + item.id"
              [class.is-active]="active() === item.id"
              [attr.aria-current]="active() === item.id ? 'location' : null"
              (click)="closeMenu()"
            >
              <span class="mobile-menu__index" aria-hidden="true">0{{ i + 1 }}</span>
              {{ item.label }}
            </a>
          </li>
        }
      </ol>

      <a href="#contato" class="btn btn--primary mobile-menu__cta" (click)="closeMenu()">
        Solicitar orçamento
        <lucide-icon class="btn__icon" [img]="arrowIcon" [size]="18" aria-hidden="true" />
      </a>
    </nav>
  </div>
</header>
