<section id="faq" class="section faq" aria-labelledby="faq-title">
  <div class="shell faq__grid">
    <header class="faq__head" appReveal>
      <p class="eyebrow">Dúvidas</p>
      <h2 id="faq-title" class="section-title">Perguntas <span class="accent">frequentes.</span></h2>
      <p class="faq__intro">
        Respostas para as dúvidas mais comuns de quem está começando um projeto. Se a sua não estiver aqui, é só
        perguntar.
      </p>
      <a class="text-link" [href]="questionUrl" target="_blank" rel="noopener noreferrer">
        <lucide-icon [img]="whatsappIcon" [size]="16" aria-hidden="true" />
        Enviar uma pergunta
      </a>
    </header>

    <div class="accordion" [appReveal]="100">
      @for (item of items; track item.question; let i = $index) {
        @let open = openIndex() === i;
        <div class="accordion__item" [class.is-open]="open">
          <h3 class="accordion__heading">
            <button
              type="button"
              class="accordion__trigger"
              [id]="'faq-question-' + i"
              [attr.aria-expanded]="open"
              [attr.aria-controls]="'faq-answer-' + i"
              (click)="toggle(i)"
            >
              <span class="accordion__index" aria-hidden="true">{{ (i + 1).toString().padStart(2, '0') }}</span>
              <span class="accordion__question">{{ item.question }}</span>
              <span class="accordion__icon" aria-hidden="true"></span>
            </button>
          </h3>
          <div
            class="accordion__panel"
            role="region"
            [id]="'faq-answer-' + i"
            [attr.aria-labelledby]="'faq-question-' + i"
            [attr.inert]="open ? null : ''"
          >
            <div class="accordion__inner">
              <p>{{ item.answer }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
